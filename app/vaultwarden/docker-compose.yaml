services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vw.domain.tld" #Utiliser votre nom de domaine
      SIGNUPS_ALLOWED: false #Passer a true pour activer la création de compte, sinon il est toujours possible de créer un compte par la page admin
      WEBSOCKET_ENABLED: true
      ADMIN_TOKEN: mon_token #Pour plus d'info pour le sécuriser : https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
    volumes:
      - ./data:/data
    ports:
      - "8642:80"
